spring.datasource.url=jdbc:h2:mem:needrelay;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.liquibase.enabled=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
needrelay.jwt.secret=test-secret-must-be-at-least-32-characters-long
needrelay.admin.email=admin@test.local
needrelay.admin.password=TestAdmin123!
needrelay.admin.display-name=Test Admin
needrelay.cors.allowed-origins=http://localhost:5173
