databaseChangeLog:
  - changeSet:
      id: 006-offer-lifecycle
      author: needrelay
      changes:
        - addColumn:
            tableName: offers
            columns:
              - column:
                  name: status
                  type: varchar(32)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: quantity_received
                  type: numeric(19, 4)
        - dropCheckConstraint:
            tableName: needs
            constraintName: chk_needs_quantities
        - sql:
            sql: ALTER TABLE needs ADD CONSTRAINT chk_needs_quantities CHECK (quantity_required > 0 AND quantity_offered >= 0)
