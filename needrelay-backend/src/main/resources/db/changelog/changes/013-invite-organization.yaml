databaseChangeLog:
  - changeSet:
      id: 013-invite-organization
      author: needrelay
      changes:
        - addColumn:
            tableName: invites
            columns:
              - column:
                  name: organization_id
                  type: uuid
              - column:
                  name: organization_role
                  type: varchar(32)
                  defaultValue: USER
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              UPDATE invites SET organization_id = created_by_id
              WHERE created_by_id IN (SELECT id FROM organizers WHERE role = 'ORGANIZER')
        - addForeignKeyConstraint:
            baseTableName: invites
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_invites_organization
