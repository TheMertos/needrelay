spring.application.name=needrelay-backend

# Loads .env (KEY=VALUE per line) from the working directory as a property source,
# so RESEND_API_KEY etc. are picked up whether the app is started via mvnw, an IDE
# run config, or java -jar — without having to export them into the shell first.

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/needrelay}
spring.datasource.username=${DATABASE_USERNAME:needrelay}
spring.datasource.password=${DATABASE_PASSWORD:needrelay}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

needrelay.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
needrelay.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
needrelay.jwt.refresh-token-days=${JWT_REFRESH_DAYS:14}

needrelay.admin.email=${ADMIN_EMAIL:admin@needrelay.local}
needrelay.admin.password=${ADMIN_PASSWORD:ChangeMeAdmin123!}
needrelay.admin.display-name=${ADMIN_DISPLAY_NAME:NeedRelay Admin}

needrelay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

needrelay.resend.api-key=${RESEND_API_KEY:}
needrelay.resend.from-email=${RESEND_FROM_EMAIL:NeedRelay <onboarding@resend.dev>}
needrelay.app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}

needrelay.login-rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
needrelay.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

needrelay.offer-rate-limit.max-attempts=${OFFER_RATE_LIMIT_MAX_ATTEMPTS:10}
needrelay.offer-rate-limit.window-seconds=${OFFER_RATE_LIMIT_WINDOW_SECONDS:600}

server.error.include-message=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.db.enabled=true
