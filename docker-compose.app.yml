# All-in-one app + Postgres.
# From repo root: docker compose -f docker-compose.app.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: needrelay-postgres
    environment:
      POSTGRES_DB: needrelay
      POSTGRES_USER: needrelay
      POSTGRES_PASSWORD: needrelay
    ports:
      - "5432:5432"
    volumes:
      - needrelay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needrelay -d needrelay"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: needrelay-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/needrelay
      DATABASE_USERNAME: needrelay
      DATABASE_PASSWORD: needrelay
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@needrelay.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeAdmin123!}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-NeedRelay Admin}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-NeedRelay <onboarding@resend.dev>}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  needrelay_pg_data:
