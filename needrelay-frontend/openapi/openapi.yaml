openapi: 3.0.3
info:
  title: NeedRelay API
  version: 0.1.0
  description: Crisis and emergency resource coordination API
servers:
  - url: /
tags:
  - name: auth
  - name: admin
  - name: invites
  - name: relief-requests
  - name: needs
  - name: comments
  - name: public
  - name: settings
paths:
  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register with invite token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation error
        '409':
          description: Conflict
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
        '429':
          description: Too many login attempts
  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out
  /api/auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Accepted
  /api/auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password updated
  /api/auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: Current organizer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerResponse'
    put:
      tags: [auth]
      operationId: updateProfile
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerResponse'
  /api/auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
  /api/admin/organizers:
    get:
      tags: [admin]
      operationId: listOrganizers
      summary: List organizers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organizers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizerResponse'
  /api/admin/organizers/{organizerId}/ban:
    post:
      tags: [admin]
      operationId: banOrganizer
      summary: Ban organizer
      security:
        - bearerAuth: []
      parameters:
        - name: organizerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerResponse'
  /api/admin/organizers/{organizerId}/unban:
    post:
      tags: [admin]
      operationId: unbanOrganizer
      summary: Unban organizer
      security:
        - bearerAuth: []
      parameters:
        - name: organizerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Unbanned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerResponse'
  /api/admin/organizers/{organizerId}/role:
    patch:
      tags: [admin]
      operationId: adminUpdateOrganizerRole
      summary: Update organization member role
      security:
        - bearerAuth: []
      parameters:
        - name: organizerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerResponse'
  /api/admin/organizations:
    get:
      tags: [admin]
      operationId: listOrganizations
      summary: List organizations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationResponse'
    post:
      tags: [admin]
      operationId: createOrganization
      summary: Create organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
  /api/admin/organizations/{organizationId}:
    put:
      tags: [admin]
      operationId: updateOrganization
      summary: Update organization
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
  /api/admin/organizations/{organizationId}/deactivate:
    post:
      tags: [admin]
      operationId: deactivateOrganization
      summary: Deactivate organization
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
  /api/admin/organizations/{organizationId}/activate:
    post:
      tags: [admin]
      operationId: activateOrganization
      summary: Activate organization
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
  /api/me/organization:
    get:
      tags: [organization]
      operationId: getMyOrganization
      summary: Get my organization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
    put:
      tags: [organization]
      operationId: updateMyOrganization
      summary: Update my organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
  /api/me/organization/members:
    get:
      tags: [organization]
      operationId: listOrganizationMembers
      summary: List organization members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationMemberResponse'
  /api/me/organization/members/{organizerId}:
    patch:
      tags: [organization]
      operationId: updateMemberRole
      summary: Update member role
      security:
        - bearerAuth: []
      parameters:
        - name: organizerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberResponse'
    delete:
      tags: [organization]
      operationId: removeMember
      summary: Remove member
      security:
        - bearerAuth: []
      parameters:
        - name: organizerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed
  /api/invites:
    get:
      tags: [invites]
      operationId: listInvites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InviteResponse'
    post:
      tags: [invites]
      operationId: createInvite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
  /api/invites/{inviteId}:
    delete:
      tags: [invites]
      operationId: revokeInvite
      summary: Revoke invite
      security:
        - bearerAuth: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked
  /api/relief-requests:
    get:
      tags: [relief-requests]
      operationId: listReliefRequests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReliefRequestSummaryResponse'
    post:
      tags: [relief-requests]
      operationId: createReliefRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReliefRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReliefRequestResponse'
  /api/relief-requests/{requestId}:
    get:
      tags: [relief-requests]
      operationId: getReliefRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReliefRequestResponse'
    put:
      tags: [relief-requests]
      operationId: updateReliefRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReliefRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReliefRequestResponse'
  /api/relief-requests/{requestId}/needs:
    get:
      tags: [needs]
      operationId: listNeeds
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
      responses:
        '200':
          description: Needs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NeedResponse'
    post:
      tags: [needs]
      operationId: createNeed
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNeedRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeedResponse'
  /api/relief-requests/{requestId}/needs/{needId}:
    put:
      tags: [needs]
      operationId: updateNeed
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
        - $ref: '#/components/parameters/needId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNeedRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeedResponse'
  /api/relief-requests/{requestId}/needs/{needId}/close:
    post:
      tags: [needs]
      operationId: closeNeed
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
        - $ref: '#/components/parameters/needId'
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeedResponse'
  /api/relief-requests/{requestId}/offers:
    get:
      tags: [relief-requests]
      operationId: listOffers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: sort
          in: query
          schema:
            type: string
            default: createdAt,desc
            enum:
              - createdAt,desc
              - createdAt,asc
              - status,asc
              - status,desc
              - quantity,desc
              - quantity,asc
              - providerName,asc
              - providerName,desc
              - providerType,asc
              - providerType,desc
              - distanceKm,asc
              - distanceKm,desc
              - firstName,asc
              - firstName,desc
              - lastName,asc
              - lastName,desc
              - phone,asc
              - phone,desc
              - email,asc
              - email,desc
        - name: needId
          in: query
          description: Scopes the page/filter/sort to a single need's independent table.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OfferStatus' }
        - name: providerType
          in: query
          schema: { $ref: '#/components/schemas/ProviderType' }
        - name: q
          in: query
          description: Free-text search across provider/first/last name, phone and email.
          schema: { type: string }
        - name: minQuantity
          in: query
          schema: { type: number }
        - name: maxQuantity
          in: query
          schema: { type: number }
        - name: minDistanceKm
          in: query
          schema: { type: number }
        - name: maxDistanceKm
          in: query
          schema: { type: number }
      responses:
        '200':
          description: Offers page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPageResponse'
  /api/relief-requests/{requestId}/offers/{offerId}:
    put:
      tags: [relief-requests]
      operationId: updateOffer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfferRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
    delete:
      tags: [relief-requests]
      operationId: deleteOffer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /api/relief-requests/{requestId}/offers/{offerId}/coming:
    post:
      tags: [relief-requests]
      operationId: markOfferComing
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Marked coming
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '409':
          description: Invalid status
  /api/relief-requests/{requestId}/offers/{offerId}/received:
    post:
      tags: [relief-requests]
      operationId: markOfferReceived
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveOfferRequest'
      responses:
        '200':
          description: Marked received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '409':
          description: Invalid status
  /api/relief-requests/{requestId}/offers/{offerId}/cancel:
    post:
      tags: [relief-requests]
      operationId: cancelOffer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '409':
          description: Not cancellable
  /api/relief-requests/{requestId}/comments:
    get:
      tags: [comments]
      operationId: listComments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
    post:
      tags: [comments]
      operationId: createComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
  /api/relief-requests/{requestId}/comments/{commentId}:
    delete:
      tags: [comments]
      operationId: deleteComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /api/relief-requests/{requestId}/contacts:
    get:
      tags: [contacts]
      operationId: listRequestContacts
      summary: List relief request contacts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizerContactResponse'
    post:
      tags: [contacts]
      operationId: createRequestContact
      summary: Create relief request contact
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOrganizerContactRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerContactResponse'
  /api/relief-requests/{requestId}/contacts/{contactId}:
    put:
      tags: [contacts]
      operationId: updateRequestContact
      summary: Update relief request contact
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOrganizerContactRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerContactResponse'
    delete:
      tags: [contacts]
      operationId: deleteRequestContact
      summary: Delete relief request contact
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/requestId'
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /api/me/contacts:
    get:
      tags: [contacts]
      operationId: listContacts
      summary: List organization contacts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizerContactResponse'
    post:
      tags: [contacts]
      operationId: createContact
      summary: Create organization contact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOrganizerContactRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerContactResponse'
  /api/me/contacts/{contactId}:
    put:
      tags: [contacts]
      operationId: updateContact
      summary: Update organization contact
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOrganizerContactRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerContactResponse'
    delete:
      tags: [contacts]
      operationId: deleteContact
      summary: Delete organization contact
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /api/settings:
    get:
      tags: [settings]
      operationId: getPublicSettings
      summary: Get public platform settings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingsResponse'
  /api/admin/settings:
    put:
      tags: [admin]
      operationId: updateSystemSettings
      summary: Update platform settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSystemSettingsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingsResponse'
  /api/public/discovery:
    get:
      tags: [public]
      operationId: getPublicDiscovery
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Discovery payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryPointPageResponse'
  /api/public/discovery/points/{requestId}/needs:
    get:
      tags: [public]
      operationId: getDiscoveryPointNeeds
      parameters:
        - $ref: '#/components/parameters/requestId'
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: Needs page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryNeedPageResponse'
  /api/public/relief-requests/{slug}:
    get:
      tags: [public]
      operationId: getPublicReliefRequest
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public page payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReliefRequestResponse'
        '404':
          description: Not found
  /api/public/needs/{needId}/offers:
    post:
      tags: [public]
      operationId: createPublicOffer
      parameters:
        - $ref: '#/components/parameters/needId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferRequest'
      responses:
        '201':
          description: Offer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '409':
          description: Exceeds remaining or closed
        '429':
          description: Too many offers from this IP
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    requestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    needId:
      name: needId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [inviteToken, email, password, displayName]
      properties:
        inviteToken: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds, organizer]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresInSeconds: { type: integer, format: int64 }
        organizer:
          $ref: '#/components/schemas/OrganizerResponse'
    OrganizerResponse:
      type: object
      required: [id, email, displayName, role, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [ADMIN, ORGANIZER] }
        active: { type: boolean }
        organizationId: { type: string, format: uuid, nullable: true }
        organizationName: { type: string, nullable: true }
        organizationRole:
          allOf: [{ $ref: '#/components/schemas/OrganizationRole' }]
          nullable: true
        createdAt: { type: string, format: date-time }
    SystemSettingsResponse:
      type: object
      required: [defaultLanguage, createdAt, updatedAt]
      properties:
        defaultLanguage: { type: string }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    UpdateSystemSettingsRequest:
      type: object
      required: [defaultLanguage]
      properties:
        defaultLanguage: { type: string }
    OrganizationResponse:
      type: object
      required: [id, name, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    UpdateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
    OrganizationMemberResponse:
      type: object
      required: [id, email, displayName, organizationRole, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        organizationRole:
          $ref: '#/components/schemas/OrganizationRole'
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    UpdateMemberRoleRequest:
      type: object
      required: [organizationRole]
      properties:
        organizationRole:
          $ref: '#/components/schemas/OrganizationRole'
    UpsertOrganizerContactRequest:
      type: object
      required: [name, role, phone, email]
      properties:
        name: { type: string }
        role: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        note: { type: string, nullable: true }
    OrganizerContactResponse:
      type: object
      required: [id, name, role, phone, email, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string }
        phone: { type: string }
        email: { type: string }
        note: { type: string, nullable: true }
        sortOrder: { type: integer }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }
    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string }
    CreateInviteRequest:
      type: object
      properties:
        email: { type: string, format: email, nullable: true }
        daysValid: { type: integer, minimum: 1, maximum: 90, default: 7 }
        organizationId: { type: string, format: uuid, nullable: true }
        organizationRole:
          allOf: [{ $ref: '#/components/schemas/OrganizationRole' }]
          nullable: true
    InviteResponse:
      type: object
      required: [id, token, expiresAt, createdAt, organizationRole]
      properties:
        id: { type: string, format: uuid }
        token: { type: string }
        email: { type: string, nullable: true }
        organizationId: { type: string, format: uuid, nullable: true }
        organizationName: { type: string, nullable: true }
        organizationRole:
          $ref: '#/components/schemas/OrganizationRole'
        expiresAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        emailSentAt: { type: string, format: date-time, nullable: true }
        emailError: { type: string, nullable: true }
    CreateReliefRequest:
      type: object
      required: [title, description, locationLabel, latitude, longitude]
      properties:
        title: { type: string }
        description: { type: string }
        locationLabel: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    UpdateReliefRequest:
      type: object
      required: [title, description, locationLabel, latitude, longitude, status]
      properties:
        title: { type: string }
        description: { type: string }
        locationLabel: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
    ReliefRequestResponse:
      type: object
      required: [id, title, description, locationLabel, latitude, longitude, publicSlug, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        locationLabel: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        publicSlug: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
    ReliefRequestSummaryResponse:
      type: object
      required: [id, title, locationLabel, publicSlug, status, openNeeds, criticalNeeds, coveredNeeds]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        locationLabel: { type: string }
        publicSlug: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        openNeeds: { type: integer }
        criticalNeeds: { type: integer }
        coveredNeeds: { type: integer }
    CreateNeedRequest:
      type: object
      required: [title, category, quantityRequired, unit, priority]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        category:
          $ref: '#/components/schemas/NeedCategory'
        quantityRequired: { type: number }
        unit: { type: string }
        priority:
          $ref: '#/components/schemas/NeedPriority'
    UpdateNeedRequest:
      type: object
      required: [title, category, quantityRequired, unit, priority]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        category:
          $ref: '#/components/schemas/NeedCategory'
        quantityRequired: { type: number }
        unit: { type: string }
        priority:
          $ref: '#/components/schemas/NeedPriority'
    NeedResponse:
      type: object
      required: [id, title, category, quantityRequired, quantityOffered, quantityPending, remaining, unit, priority, status]
      properties:
        id: { type: string, format: uuid }
        reliefRequestId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        category:
          $ref: '#/components/schemas/NeedCategory'
        quantityRequired: { type: number }
        quantityOffered: { type: number }
        quantityPending: { type: number }
        remaining: { type: number }
        unit: { type: string }
        priority:
          $ref: '#/components/schemas/NeedPriority'
        status:
          $ref: '#/components/schemas/NeedStatus'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReceiveOfferRequest:
      type: object
      required: [quantityReceived]
      properties:
        quantityReceived: { type: number }
    OfferStatus:
      type: string
      enum: [PENDING, COMING, RECEIVED, CANCELLED]
    ProviderType:
      type: string
      enum: [PERSON, ORGANIZATION]
    OrganizationRole:
      type: string
      enum: [ADMIN, USER]
    CreateOfferRequest:
      type: object
      required: [providerName, providerType, quantity, firstName, lastName, phone, email]
      properties:
        providerName: { type: string }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        quantity: { type: number }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 80 }
        email: { type: string, format: email, maxLength: 320 }
        note: { type: string, nullable: true }
        latitude:
          type: number
          format: double
          nullable: true
          description: Offerer's current latitude from an optional browser geolocation share; used only to compute distanceKm and never persisted.
        longitude:
          type: number
          format: double
          nullable: true
          description: Offerer's current longitude, see latitude.
    UpdateOfferRequest:
      type: object
      required: [providerName, providerType, quantity, firstName, lastName, phone, email]
      properties:
        providerName: { type: string }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        quantity: { type: number }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 80 }
        email: { type: string, format: email, maxLength: 320 }
        note: { type: string, nullable: true }
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 4000 }
    CommentResponse:
      type: object
      required: [id, reliefRequestId, authorId, authorDisplayName, body, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        reliefRequestId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorDisplayName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OfferPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfferResponse'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    OfferResponse:
      type: object
      required:
        [
          id,
          needId,
          providerName,
          providerType,
          quantity,
          status,
          firstName,
          lastName,
          phone,
          email,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        needId: { type: string, format: uuid }
        providerName: { type: string }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        quantity: { type: number }
        quantityReceived: { type: number, nullable: true }
        status: { $ref: '#/components/schemas/OfferStatus' }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        note: { type: string, nullable: true }
        distanceKm:
          type: number
          nullable: true
          description: Distance in km from the offerer's shared location to the relief request, null when no location was shared.
        createdAt: { type: string, format: date-time }
    PublicReliefRequestResponse:
      type: object
      required:
        [
          title,
          description,
          locationLabel,
          latitude,
          longitude,
          publicSlug,
          needs,
          organizationName,
          contacts,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        locationLabel: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        publicSlug: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        needs:
          type: array
          items:
            $ref: '#/components/schemas/NeedResponse'
        organizationName: { type: string }
        organizationDescription: { type: string, nullable: true }
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/OrganizerContactResponse'
        createdAt: { type: string, format: date-time }
    DiscoveryPointResponse:
      type: object
      required: [id, title, locationLabel, latitude, longitude, publicSlug]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        locationLabel: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        publicSlug: { type: string }
    DiscoveryNeedResponse:
      type: object
      required:
        [
          id,
          title,
          category,
          quantityRequired,
          quantityOffered,
          quantityPending,
          remaining,
          unit,
          priority,
          status,
          requestId,
          publicSlug,
          locationLabel,
          organizationName,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { $ref: '#/components/schemas/NeedCategory' }
        quantityRequired: { type: number }
        quantityOffered: { type: number }
        quantityPending: { type: number }
        remaining: { type: number }
        unit: { type: string }
        priority: { $ref: '#/components/schemas/NeedPriority' }
        status: { $ref: '#/components/schemas/NeedStatus' }
        requestId: { type: string, format: uuid }
        publicSlug: { type: string }
        locationLabel: { type: string }
        organizationName: { type: string }
    DiscoveryPointPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryPointResponse'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    DiscoveryNeedPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryNeedResponse'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    NeedCategory:
      type: string
      enum: [FOOD, WATER, CLOTHING, SUPPLIES, EQUIPMENT, MACHINERY, VEHICLES, SHELTER, SERVICES, OTHER]
    NeedPriority:
      type: string
      enum: [CRITICAL, HIGH, NORMAL, LOW]
    NeedStatus:
      type: string
      enum: [OPEN, PARTIALLY_COVERED, COVERED, CLOSED]
