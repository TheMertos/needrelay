# NeedRelay emergency stack (host network).
# Image: themertos/needrelay
# Docs: DEPLOY.md
# Usage: cp .env.example .env && docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: needrelay-postgres
    network_mode: host
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-needrelay}
      POSTGRES_USER: ${POSTGRES_USER:-needrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - needrelay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: themertos/needrelay:${APP_IMAGE_TAG:-latest}
    container_name: needrelay-app
    network_mode: host
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/${POSTGRES_DB:-needrelay}
      DATABASE_USERNAME: ${POSTGRES_USER:-needrelay}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@needrelay.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-NeedRelay Admin}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?Set APP_PUBLIC_BASE_URL in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-NeedRelay <onboarding@resend.dev>}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: needrelay-caddy
    network_mode: host
    restart: always
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  needrelay_pg_data:
  caddy_data:
  caddy_config:
